# CT314 (websites) -> /etc/nginx/sites-enabled/portfolio
# levac.net behind Nginx Proxy Manager (CT300), which terminates TLS and forwards the original Host header.
# Kept in the repository for reference; the deploy copies it to the web root, where the dotfile rule below hides it.
# Previous version: `try_files $uri $uri/ /index.html` answered every unknown path (robots.txt, sitemap.xml, typos)
# with the homepage and a 200, and www.levac.net served a duplicate site.

# One canonical host.
server {
    listen 80;
    server_name www.levac.net;
    return 301 https://levac.net$request_uri;
}

server {
    listen 80;
    server_name levac.net;

    root /var/www/portfolio;
    index index.html;

    # Security headers on every response (errors included). HSTS without includeSubDomains/preload on purpose:
    # other *.levac.net hosts are not covered by this change.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Exactly what the pages use: Google Fonts, GSAP from jsDelivr (with SRI), the n8n contact webhook,
    # inline style attributes, and data: SVGs in CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://hooks.levac.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The deploy copies the whole repository; never serve dotfiles (.gitignore, .github/, .deploy/).
    location ~ /\. {
        return 404;
    }

    # Static images: cache for a week. `expires` (not add_header) so the server-level headers above still apply.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
