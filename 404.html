<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - James Levac</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: radial-gradient(900px 500px at 75% 15%, rgba(0, 212, 255, 0.08), transparent 70%), #0a0a0f;
      color: #e2e8f0;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      text-align: center;
    }
    .label { font-family: 'JetBrains Mono', monospace; color: #00d4ff; font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; margin: 0.75rem 0; }
    p { color: #94a3b8; margin: 0 0 2rem; line-height: 1.6; }
    nav { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.7rem 1.3rem;
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: 6px;
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
    }
    a.primary { background: #00d4ff; border-color: #00d4ff; color: #001018; }
    a:hover { border-color: #00d4ff; }
  </style>
</head>
<body>
  <main>
    <div class="label">// 404</div>
    <h1>Page not found</h1>
    <p>That address doesn't exist on levac.net. It may have moved, or the link may be mistyped.</p>
    <nav aria-label="Where to go">
      <a class="primary" href="/">Go to the homepage</a>
      <a href="/#utilities">Helpful tools</a>
      <a href="/#contact">Contact</a>
    </nav>
  </main>
</body>
</html>
